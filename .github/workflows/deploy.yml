# Déploiement Render sur étiquette v* uniquement, en dehors des ateliers (AD-13) :
# le webservice d'abord, puis le front une fois le webservice « live ».
#
# Secrets du dépôt : RENDER_DEPLOY_HOOK_BACKEND, RENDER_DEPLOY_HOOK_FRONTEND, RENDER_API_KEY.
# Variables du dépôt : RENDER_BACKEND_SERVICE_ID et RENDER_FRONTEND_SERVICE_ID (srv-…). Voir deploy/README.md.
name: Deploy

on:
  push:
    tags: ['v*']

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: L'étiquette doit pointer sur la tête de main (Render déploie main)
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::error::L'étiquette ${GITHUB_REF_NAME} ne pointe pas sur la tête de main."
            exit 1
          fi

      - name: Webservice
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
          SERVICE_ID: ${{ vars.RENDER_BACKEND_SERVICE_ID }}
        run: bash deploy/render-deploy.sh

      - name: Front
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}
          SERVICE_ID: ${{ vars.RENDER_FRONTEND_SERVICE_ID }}
        run: bash deploy/render-deploy.sh
