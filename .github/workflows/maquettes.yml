# Publie les maquettes UX sur GitHub Pages, à chaque push sur main qui touche les maquettes ou la feuille de style du
# front, et à la demande (onglet Actions). Les maquettes sont régénérées avant publication (generer.mjs) : app.css
# suit donc toujours la feuille de style de main, même si la copie du dépôt n'a pas été rafraîchie.
# Réglage unique du dépôt : Settings › Pages › Build and deployment › Source = « GitHub Actions ».
name: Maquettes

on:
  push:
    branches: [main]
    paths:
      - _bmad-output/planning-artifacts/ux-designs/ux-planning-poker-2026-09-29/mockups/**
      - frontend/src/styles.css
      - frontend/src/styles/**
      - .github/workflows/maquettes.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maquettes
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MOCKUPS: _bmad-output/planning-artifacts/ux-designs/ux-planning-poker-2026-09-29/mockups
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # generer.mjs lit qrcode-generator dans les dépendances du front pour dessiner le QR code.
      - run: npm ci
        working-directory: frontend
      - run: node "$MOCKUPS/generer.mjs"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ env.MOCKUPS }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
