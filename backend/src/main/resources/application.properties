spring.application.name=planning-poker

# AD-12 : configuration par variables d'environnement uniquement.
server.port=${PORT:8080}
planning-poker.allowed-origins=${ALLOWED_ORIGINS:}

# Vivacité des connexions (AD-8) : ping de protocole, seuil de silence, passage du balayeur.
planning-poker.ping-interval=5s
planning-poker.liveness-timeout=15s
planning-poker.sweep-interval=1s

# Retrait d'un participant sans aucune connexion depuis ce délai (AD-7) ; son jeton reste valable pour revenir.
planning-poker.absence-timeout=5m

# Erreurs REST en application/problem+json (RFC 9457).
spring.mvc.problemdetails.enabled=true

# Journaux JSON sur la sortie standard (jamais de jeton, de pseudo ni de vote caché).
logging.structured.format.console=logstash

server.shutdown=graceful

# Contrat d'abord (AD-6) : aucun champ hors contrat (voir aussi JacksonConfig).
spring.jackson.deserialization.fail-on-unknown-properties=true
