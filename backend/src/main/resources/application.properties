spring.application.name=planning-poker

# AD-12 : configuration par variables d'environnement uniquement.
server.port=${PORT:8080}
planning-poker.allowed-origins=${ALLOWED_ORIGINS:}

# Vivacité des connexions (AD-8) : ping de protocole, seuil de silence, passage du balayeur.
planning-poker.ping-interval=5s
planning-poker.liveness-timeout=15s
planning-poker.sweep-interval=1s

# Retrait d'un participant sans aucune connexion depuis ce délai (AD-7) ; son jeton reste valable pour revenir.
planning-poker.absence-timeout=5m

# Suppression d'une session, avec ses pseudos, votes et jetons, ce délai après sa création (FR-4).
planning-poker.session-lifetime=24h

# Plafonds face aux abus (NFR4, NFR6) : corps REST (413), message WebSocket (fermeture 1009), sessions en mémoire
# (503 SESSION_LIMIT_REACHED), créations par IP cliente sur une fenêtre glissante (429 TOO_MANY_REQUESTS) et
# participants par session (409 SESSION_FULL). Les retraits et les expirations libèrent des places.
planning-poker.max-request-body=2KB
planning-poker.max-ws-message=4KB
planning-poker.max-sessions=50
planning-poker.max-creations-per-ip=10
planning-poker.creation-window=1m
planning-poker.max-participants=30

# Erreurs REST en application/problem+json (RFC 9457).
spring.mvc.problemdetails.enabled=true

# Journaux JSON sur la sortie standard (jamais de jeton, de pseudo ni de vote caché).
logging.structured.format.console=logstash

server.shutdown=graceful

# Contrat d'abord (AD-6) : aucun champ hors contrat (voir aussi JacksonConfig).
spring.jackson.deserialization.fail-on-unknown-properties=true
