openapi: 3.2.0
info:
  title: Planning Poker - REST API
  version: 1.0.0
  description: |
    Closed REST surface of the webservice (AD-2). Every session action
    (vote, reveal, hide, clear, changeRole) goes through the WebSocket
    described in `asyncapi.yaml`, never through REST.

    - Errors are `application/problem+json` (RFC 9457) with a `code`
      property. The text shown to the user comes from the front.
    - A malformed request body (unknown role, missing field, invalid JSON)
      is a `400` problem **without** `code`.
    - A `sessionId` of the wrong shape is a session that does not exist
      (`404 SESSION_NOT_FOUND`).
    - Any other status (5xx, or a 502/503 from the host's proxy during a
      cold start) is `default`: its body is not guaranteed. The front treats
      it as "server not available yet" and keeps polling `/api/health`.
      A `503` counts as `SessionLimitReached` only when its body is a problem
      with `code: SESSION_LIMIT_REACHED`.
    - Abuse limits (NFR4, NFR6), set by configuration: request body of 2 KB
      at most (`413`, no `code`), 50 sessions in memory
      (`503 SESSION_LIMIT_REACHED`), 10 session creations per minute per
      client IP (`429 TOO_MANY_REQUESTS` with `Retry-After`), 30 participants
      per session (`409 SESSION_FULL`). Session expiry and the removal of
      absent participants free places.
    - The contract only evolves by addition (AD-13).
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary

servers:
  - url: http://localhost:8080
    description: Local development. Deployed URLs come from `apiBaseUrl` in the front's `/config.json` (AD-11).

# No authentication: access by link is an accepted risk (NFR-6). The participant
# token returned on create/join is never a REST credential: it only
# authenticates the WebSocket `hello` message.
security: []

tags:
  - name: health
    description: Wake-up probe.
  - name: sessions
    description: Create, check and join a session.

paths:
  /api/health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Wake-up and health probe
      description: Answers 200 as soon as the webservice is ready. Polled by the front during the cold start (up to 3 min), called every 5 min by each open session page to keep the service awake, and used by Render as health check.
      responses:
        '200':
          description: The webservice is ready.
          content:
            application/json:
              schema:
                $ref: './schemas/health-response.json'
        default:
          $ref: '#/components/responses/Unexpected'

  /api/sessions:
    post:
      tags: [sessions]
      operationId: createSession
      summary: Create a session and join it
      description: Creates the session **and** makes its creator join it, with the given pseudo and role. No special right is attached to the creator.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/create-session-request.json'
      responses:
        '201':
          description: Session created, creator joined.
          content:
            application/json:
              schema:
                $ref: './schemas/create-session-response.json'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/SessionLimitReached'
        default:
          $ref: '#/components/responses/Unexpected'

  /api/sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [sessions]
      operationId: checkSession
      summary: Check that a session exists
      description: Called by the front as soon as a session link is opened (FR-3).
      responses:
        '204':
          description: The session exists.
        '404':
          $ref: '#/components/responses/SessionNotFound'
        default:
          $ref: '#/components/responses/Unexpected'

  /api/sessions/{sessionId}/participants:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [sessions]
      operationId: joinSession
      summary: Join a session, or take over a disconnected participant
      description: |
        Joins the session with a free pseudo. If the pseudo (compared after
        normalization, ignoring case) belongs to a **disconnected**
        participant, takes this participant over with the same
        `participantId`, role and vote: a new token is issued, the old one is
        revoked and its connections are closed with `4401` (FR-8, AD-7).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/join-session-request.json'
      responses:
        '200':
          description: Participant joined (or taken over).
          content:
            application/json:
              schema:
                $ref: './schemas/join-session-response.json'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          description: |
            The pseudo belongs to a connected participant (`PSEUDO_TAKEN`), or
            the session is full and the caller would be a new participant
            (`SESSION_FULL`). Checked in that order; taking over a
            disconnected participant adds nobody, so it is never `SESSION_FULL`.
          content:
            application/problem+json:
              schema:
                oneOf:
                  - $ref: '#/components/responses/PseudoTaken/content/application~1problem+json/schema'
                  - $ref: '#/components/responses/SessionFull/content/application~1problem+json/schema'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        default:
          $ref: '#/components/responses/Unexpected'

components:
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      description: "Normally 128 random bits, base64url without padding (22 characters). The parameter is deliberately not constrained: an id of the wrong shape is an unknown session (404 SESSION_NOT_FOUND), never a 400."
      schema:
        type: string

  responses:
    Unexpected:
      description: Server error, or a host proxy answer during a cold start. The body is not guaranteed and must not be relied upon.
    BadRequest:
      description: Invalid pseudo (`INVALID_PSEUDO`), or malformed body (no `code`), including a body that breaks the schema bounds (e.g. a raw pseudo over 200 characters).
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: './schemas/problem.json'
              - properties:
                  status:
                    const: 400
                  code:
                    const: INVALID_PSEUDO
    SessionNotFound:
      description: Unknown or expired session.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: './schemas/problem.json'
              - required: [code]
                properties:
                  status:
                    const: 404
                  code:
                    const: SESSION_NOT_FOUND
    PseudoTaken:
      description: The pseudo belongs to a connected participant of the session (ignoring case and surrounding spaces).
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: './schemas/problem.json'
              - required: [code]
                properties:
                  status:
                    const: 409
                  code:
                    const: PSEUDO_TAKEN
    SessionFull:
      description: The session already has the maximum number of participants (30 by default) and the caller would be a new one. Removed participants do not count.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: './schemas/problem.json'
              - required: [code]
                properties:
                  status:
                    const: 409
                  code:
                    const: SESSION_FULL
    PayloadTooLarge:
      description: The request body is larger than the limit (2 KB by default). Refused without reading the body beyond the limit. No `code`, and no CORS headers.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: './schemas/problem.json'
              - not:
                  required: [code]
                properties:
                  status:
                    const: 413
    TooManyRequests:
      description: This client IP already created the maximum number of sessions (10 by default) within the sliding window (1 minute by default). Only successful creations count.
      headers:
        Retry-After:
          description: Whole seconds (rounded up, at least 1) until the oldest creation leaves the window.
          required: true
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: './schemas/problem.json'
              - required: [code]
                properties:
                  status:
                    const: 429
                  code:
                    const: TOO_MANY_REQUESTS
    SessionLimitReached:
      description: The service already holds the maximum number of sessions in memory (50 by default). An expired session frees its place.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: './schemas/problem.json'
              - required: [code]
                properties:
                  status:
                    const: 503
                  code:
                    const: SESSION_LIMIT_REACHED
